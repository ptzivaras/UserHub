services:
  mysql:
    image: mysql:8.0
    container_name: userhub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - userhub-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend/userhub/userhub
      dockerfile: Dockerfile
    container_name: userhub-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - userhub-network

  frontend:
    build:
      context: ./frontend/userhub-ui
      dockerfile: Dockerfile
    container_name: userhub-frontend
    environment:
      VITE_API_URL: http://backend:8080/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - userhub-network

networks:
  userhub-network:
    driver: bridge

volumes:
  mysql_data:
